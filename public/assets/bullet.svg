<svg viewBox="0 0 20 20" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="peaBody" cx="36%" cy="32%" r="68%">
      <stop offset="0%"  stop-color="#d8f77a"/>
      <stop offset="42%" stop-color="#93d02a"/>
      <stop offset="100%" stop-color="#4e8a12"/>
    </radialGradient>
    <radialGradient id="peaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#a9e750" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a9e750" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 外发光 -->
  <circle cx="10" cy="10" r="10" fill="url(#peaGlow)"/>

  <!-- 豌豆主体 -->
  <circle cx="10" cy="10" r="7" fill="url(#peaBody)"
          stroke="#356007" stroke-width="1.2"/>

  <!-- 底部暗部，增加体积感 -->
  <path d="M4.6 12.4 A6.4 6.4 0 0 0 15.4 12.4 A6.4 6.4 0 0 1 4.6 12.4 Z"
        fill="#2f5506" fill-opacity="0.45"/>

  <!-- 高光 -->
  <ellipse cx="7.4" cy="7.2" rx="2.5" ry="1.9" fill="#f2ffb8" fill-opacity="0.92"
           transform="rotate(-28 7.4 7.2)"/>
  <circle cx="6.4" cy="6.3" r="0.85" fill="#ffffff" fill-opacity="0.95"/>

  <!-- 边缘反光 -->
  <path d="M13.9 13.6 A5.4 5.4 0 0 0 15.4 9.6"
        fill="none" stroke="#c9f07a" stroke-width="1.1"
        stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
