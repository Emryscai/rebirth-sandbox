<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重生沙盘 - 原型</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0d12;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app { width: 960px; height: 640px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // ===== 原创变异体 SVG：暗黑超自然少年漫风，非任何官方角色 =====
    const ZOMBIE_IDLE_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c1b8"/><stop offset="1" stop-color="#5d7370"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202534"/><stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M8 82 Q2 64 12 54 Q6 42 18 34 Q14 22 26 18 Q34 6 48 14 Q60 20 56 36 Q66 48 56 60 Q66 74 52 84 Q38 96 24 90 Q14 90 8 82Z" fill="#090a12" opacity="0.55"/>
  <path d="M24 64 L20 92 L28 92 L31 68Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M36 64 L40 92 L48 92 L43 68Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M22 38 Q32 30 44 38 L46 68 Q32 74 18 68Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M22 48 L16 64 L22 66 L27 54Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M44 46 L50 60 L44 64 L39 52Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M16 64 Q10 72 14 78 Q18 82 21 74" fill="url(#skin)" stroke="#07080c" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 60 Q56 68 52 76 Q48 80 45 72" fill="url(#skin)" stroke="#07080c" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 16 Q32 6 44 16 L45 30 Q42 38 32 40 Q22 38 19 30Z" fill="url(#skin)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M20 18 L16 10 L24 14 L26 6 L31 14 L36 5 L39 14 L47 10 L44 20" fill="#0b0d14" stroke="#07080c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M25 24 L31 26" stroke="#c7ff4a" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M39 26 L33 24" stroke="#c7ff4a" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M25 33 Q32 36 39 33" stroke="#07080c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M27 33 L27 36 M32 34 L32 37 M37 33 L37 36" stroke="#d9e6df" stroke-width="2"/>
  <path d="M30 40 L28 48 L32 54 L29 62" stroke="#8dfcff" stroke-width="2" fill="none" opacity="0.9" filter="url(#glow)"/>
  <path d="M40 42 L43 48 L40 52" stroke="#b388ff" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
</svg>`;

    const ZOMBIE_EAT_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c1b8"/><stop offset="1" stop-color="#5d7370"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202534"/><stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M4 84 Q0 62 12 50 Q4 36 18 28 Q16 14 30 12 Q44 2 54 16 Q68 26 58 40 Q70 54 56 66 Q68 80 50 90 Q34 100 20 92 Q10 92 4 84Z" fill="#090a12" opacity="0.7"/>
  <path d="M22 66 L18 92 L26 92 L29 70Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M36 66 L42 92 L50 92 L44 70Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M20 40 Q32 28 46 38 L48 68 Q32 76 16 68Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M20 46 L10 38 L6 46 L18 54Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M46 44 L56 34 L60 42 L50 52Z" fill="url(#cloth)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M8 44 Q2 40 4 34 Q8 30 12 38" fill="url(#skin)" stroke="#07080c" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 38 Q64 34 62 28 Q58 24 54 32" fill="url(#skin)" stroke="#07080c" stroke-width="4" stroke-linecap="round"/>
  <path d="M18 14 Q32 4 46 14 L47 30 Q44 42 32 44 Q20 42 17 30Z" fill="url(#skin)" stroke="#07080c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M18 16 L14 8 L22 12 L24 4 L30 12 L36 3 L40 12 L48 8 L45 18" fill="#0b0d14" stroke="#07080c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M23 22 L30 24" stroke="#c7ff4a" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M41 24 L34 22" stroke="#c7ff4a" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M23 30 Q32 26 41 30 Q38 42 32 44 Q26 42 23 30Z" fill="#120b14" stroke="#07080c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M26 30 L26 35 M31 29 L31 36 M36 29 L36 35" stroke="#d9e6df" stroke-width="2"/>
  <path d="M28 39 Q32 41 36 39" stroke="#8dfcff" stroke-width="2" fill="none" filter="url(#glow)"/>
  <path d="M30 44 L27 52 L32 58 L28 66" stroke="#8dfcff" stroke-width="2" fill="none" opacity="0.9" filter="url(#glow)"/>
  <path d="M42 44 L45 50 L42 56" stroke="#b388ff" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
</svg>`;

    // 把 SVG 字符串转成 Blob URL，供 Phaser 加载
    const mutantIdleUrl = URL.createObjectURL(new Blob([ZOMBIE_IDLE_SVG], { type: 'image/svg+xml' }));
    const mutantEatUrl = URL.createObjectURL(new Blob([ZOMBIE_EAT_SVG], { type: 'image/svg+xml' }));

    // ===== 格子系统 =====
    class GridSystem {
      constructor(cols, rows, cell, offsetX, offsetY) {
        this.cols = cols;
        this.rows = rows;
        this.cell = cell;
        this.offsetX = offsetX;
        this.offsetY = offsetY;
        this.occupied = new Set();
      }
      key(c, r) { return c + ',' + r; }
      canPlace(c, r) {
        return c >= 0 && c < this.cols && r >= 0 && r < this.rows && !this.occupied.has(this.key(c, r));
      }
      occupy(c, r) { this.occupied.add(this.key(c, r)); }
      free(c, r) { this.occupied.delete(this.key(c, r)); }
      cellToWorld(c, r) {
        return {
          x: this.offsetX + c * this.cell + this.cell / 2,
          y: this.offsetY + r * this.cell + this.cell / 2
        };
      }
    }

    // ===== 玩家变异体 =====
    class PlayerMutant extends Phaser.Physics.Arcade.Sprite {
      constructor(scene, x, y) {
        super(scene, x, y, 'mutant');
        scene.add.existing(this);
        scene.physics.add.existing(this);
        this.hp = 100;
        this.maxHp = 100;
        this.speed = 170;
        this.stage = 0;
        this.evolutionPoints = 0;
        this.eatTimer = 0;
        this.setSize(26, 60);
        this.setOffset(11, 10);
        this.keys = scene.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');
      }
      update() {
        let vx = 0, vy = 0;
        if (this.keys.A.isDown || this.keys.LEFT.isDown) vx -= 1;
        if (this.keys.D.isDown || this.keys.RIGHT.isDown) vx += 1;
        if (this.keys.W.isDown || this.keys.UP.isDown) vy -= 1;
        if (this.keys.S.isDown || this.keys.DOWN.isDown) vy += 1;
        const len = Math.hypot(vx, vy) || 1;
        this.setVelocity((vx / len) * this.speed, (vy / len) * this.speed);
      }
      hurt(damage) {
        this.hp -= damage;
        this.setTint(0xff5555);
        this.scene.time.delayedCall(80, () => this.clearTint());
      }
      tryEvolve() {
        const need = [5, 12, 25];
        if (this.stage >= 2) return;
        if (this.evolutionPoints < need[this.stage]) return;
        this.evolutionPoints -= need[this.stage];
        this.stage++;
        if (this.stage === 1) {
          this.speed = 200;
          this.maxHp = 130;
          this.hp = this.maxHp;
        }
        if (this.stage === 2) {
          this.speed = 230;
          this.maxHp = 180;
          this.hp = this.maxHp;
          this.setScale(1.25);
        }
      }
    }

    // ===== 植物 =====
    class Plant extends Phaser.Physics.Arcade.Sprite {
      constructor(scene, x, y, kind) {
        super(scene, x, y, kind === 'shooter' ? 'plantShooter' : 'plantWall');
        this.kind = kind;
        scene.add.existing(this);
        scene.physics.add.existing(this);
        this.setImmovable(true);
        if (kind === 'wall') {
          this.hp = 120;
          this.maxHp = 120;
          this.eatTime = 1.8;
          this.evolveValue = 5;
        } else {
          this.hp = 60;
          this.maxHp = 60;
          this.eatTime = 1.2;
          this.evolveValue = 3;
        }
        this.cooldown = Phaser.Math.FloatBetween(0.5, 2);
      }
      updatePlant(dt, player, bullets) {
        if (this.kind !== 'shooter') return;
        this.cooldown -= dt;
        if (this.cooldown > 0) return;
        this.cooldown = 2;
        const dir = new Phaser.Math.Vector2(player.x - this.x, player.y - this.y).normalize();
        const bullet = this.scene.physics.add.image(this.x, this.y, 'bullet');
        bullet.setVelocity(dir.x * 230, dir.y * 230);
        bullets.add(bullet);
      }
    }

    // ===== 植物生成器 =====
    class PlantSpawner {
      constructor(scene, grid, plants) {
        this.scene = scene;
        this.grid = grid;
        this.plants = plants;
        this.timer = 0;
        this.elapsed = 0;
        this.interval = 3;
      }
      update(dt, player) {
        this.elapsed += dt;
        this.interval = Math.max(1.2, 3 - this.elapsed * 0.03);
        this.timer += dt;
        if (this.timer < this.interval) return;
        this.timer = 0;
        if (this.plants.countActive(true) >= 30) return;
        for (let i = 0; i < 20; i++) {
          const col = Phaser.Math.Between(0, this.grid.cols - 1);
          const row = Phaser.Math.Between(0, this.grid.rows - 1);
          if (!this.grid.canPlace(col, row)) continue;
          const pos = this.grid.cellToWorld(col, row);
          if (Phaser.Math.Distance.Between(pos.x, pos.y, player.x, player.y) < 150) continue;
          const kind = Math.random() < 0.75 ? 'shooter' : 'wall';
          const plant = new Plant(this.scene, pos.x, pos.y, kind);
          this.plants.add(plant);
          this.grid.occupy(col, row);
          plant.once('destroy', () => this.grid.free(col, row));
          return;
        }
      }
    }

    // ===== 主场景 =====
    class GameScene extends Phaser.Scene {
      constructor() { super('GameScene'); }

      preload() {
        if (!this.textures.exists('mutant')) {
          this.load.svg('mutant', mutantIdleUrl, { width: 48, height: 72 });
        }
        if (!this.textures.exists('mutantEat')) {
          this.load.svg('mutantEat', mutantEatUrl, { width: 48, height: 72 });
        }
      }

      create() {
        this.alive = true;
        this.survival = 0;
        this.makeTextures();

        this.grid = new GridSystem(10, 14, 48, 120, 60);
        this.drawGrid();

        this.plants = this.physics.add.group();
        this.bullets = this.physics.add.group();

        const start = this.grid.cellToWorld(4, 12);
        this.player = new PlayerMutant(this, start.x, start.y);

        this.spawner = new PlantSpawner(this, this.grid, this.plants);

        this.physics.add.overlap(this.player, this.bullets, (_p, bullet) => {
          bullet.destroy();
          this.player.hurt(8);
        });

        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        this.hud = this.add.text(12, 10, '', { fontSize: '18px', color: '#e8f6ef' }).setDepth(10);
        this.input.keyboard.on('keydown-R', () => this.scene.restart());
      }

      update(_time, deltaMs) {
        if (!this.alive) return;
        const dt = deltaMs / 1000;
        this.survival += dt;

        this.player.update();
        this.spawner.update(dt, this.player);

        for (const p of this.plants.getChildren()) {
          p.updatePlant(dt, this.player, this.bullets);
        }
        for (const b of this.bullets.getChildren()) {
          if (b.x < -50 || b.x > 1010 || b.y < -50 || b.y > 690) b.destroy();
        }

        this.checkEat(dt);

        if (this.player.hp <= 0) this.gameOver();

        this.hud.setText(
          '存活 ' + this.survival.toFixed(1) + 's   生命值 ' + Math.max(0, Math.round(this.player.hp)) +
          '   进化 ' + this.player.stage + '   金币 ' + Math.floor(this.survival / 10)
        );
      }

      checkEat(dt) {
        if (!this.spaceKey.isDown) {
          this.player.eatTimer = 0;
          this.player.setTexture('mutant');
          return;
        }

        let nearest = null;
        let bestDist = 50;
        for (const plant of this.plants.getChildren()) {
          const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, plant.x, plant.y);
          if (d < bestDist) {
            bestDist = d;
            nearest = plant;
          }
        }

        if (!nearest) {
          this.player.eatTimer = 0;
          this.player.setTexture('mutant');
          return;
        }

        this.player.setTexture('mutantEat');
        this.player.eatTimer += dt;
        if (this.player.eatTimer >= nearest.eatTime) {
          nearest.destroy();
          this.player.evolutionPoints += nearest.evolveValue;
          this.player.hp = Math.min(this.player.maxHp, this.player.hp + 5);
          this.player.eatTimer = 0;
          this.player.tryEvolve();
          this.player.setTexture('mutant');
        }
      }

      gameOver() {
        this.alive = false;
        this.player.setVelocity(0, 0);
        this.player.setTexture('mutant');

        const best = Number(localStorage.getItem('avoid-death-best') || 0);
        const record = Math.max(best, this.survival);
        if (this.survival > best) {
          localStorage.setItem('avoid-death-best', String(this.survival));
        }

        this.add.text(480, 300,
          '挑战失败\n存活 ' + this.survival.toFixed(1) + ' 秒\n最高 ' + record.toFixed(1) + ' 秒\n按 R 重开',
          { fontSize: '32px', color: '#ffffff', align: 'center' }
        ).setOrigin(0.5).setDepth(100);
      }

      makeTextures() {
        if (this.textures.exists('plantShooter')) return;
        const g = this.add.graphics();
        g.fillStyle(0x2e8b57).fillRect(0, 0, 32, 32).generateTexture('plantShooter', 32, 32).clear();
        g.fillStyle(0x8b4513).fillRect(0, 0, 32, 32).generateTexture('plantWall', 32, 32).clear();
        g.fillStyle(0xffd700).fillCircle(6, 6, 6).generateTexture('bullet', 12, 12).destroy();
      }

      drawGrid() {
        const g = this.add.graphics();
        g.lineStyle(1, 0x2f5d36, 0.6);
        for (let c = 0; c <= this.grid.cols; c++) {
          const x = this.grid.offsetX + c * this.grid.cell;
          g.lineBetween(x, this.grid.offsetY, x, this.grid.offsetY + this.grid.rows * this.grid.cell);
        }
        for (let r = 0; r <= this.grid.rows; r++) {
          const y = this.grid.offsetY + r * this.grid.cell;
          g.lineBetween(this.grid.offsetX, y, this.grid.offsetX + this.grid.cols * this.grid.cell, y);
        }
      }
    }

    // ===== 启动 =====
    new Phaser.Game({
      type: Phaser.AUTO,
      width: 960,
      height: 640,
      backgroundColor: '#3a7d44',
      physics: { default: 'arcade', arcade: { debug: false } },
      scene: [GameScene],
      parent: 'app'
    });
  </script>
</body>
</html>
