<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0918" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="author" content="JiahaoCai" />
  <meta name="description" content="重生沙盘：你是变异体，活得越久越强。躲弹丸、啃植物、进化，在十格棋盘上活到最后。Rebirth Sandbox - a fast arcade survival game." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="重生沙盘 · Rebirth Sandbox" />
  <meta property="og:description" content="你是变异体，活得越久越强。躲弹丸、啃植物、进化。" />
  <meta property="og:image" content="./assets/cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <title>重生沙盘 · Rebirth Sandbox</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; background: #0a0918;
      width: 100%; height: 100%; overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    #game-root {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 18%, rgba(52, 20, 84, 0.55), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(14, 70, 86, 0.35), transparent 60%),
        #0a0918;
    }
    canvas { display: block; box-shadow: 0 0 60px rgba(80, 200, 240, 0.18); }

    /* 首屏加载层：脚本/素材就绪后淡出，避免白屏 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #122a34 0%, #0a0918 62%);
      transition: opacity 420ms ease;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash .title {
      font-size: clamp(34px, 10vw, 64px); font-weight: 800; letter-spacing: 4px;
      color: #e8eef4; text-shadow: 0 0 24px rgba(127, 227, 255, 0.35), 0 4px 0 #05060a;
    }
    #boot-splash .sub {
      margin-top: 10px; font-size: 12px; letter-spacing: 6px; color: #7f96a8;
    }
    #boot-splash .bar {
      margin-top: 34px; width: min(220px, 52vw); height: 4px; border-radius: 4px;
      background: #1b2430; overflow: hidden;
    }
    #boot-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, #4fd1e0, transparent);
      animation: slide 1.1s infinite ease-in-out;
    }
    @keyframes slide { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    #boot-splash .credit {
      position: absolute; bottom: max(18px, env(safe-area-inset-bottom));
      font-size: 12px; color: #5f7386;
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="boot-splash">
    <div class="title">重生沙盘</div>
    <div class="sub">REBIRTH&nbsp;&nbsp;SANDBOX</div>
    <div class="bar"></div>
    <div class="credit">作者：JiahaoCai</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
